# URAAS CI Pipeline
#
# Rewritten 2026-08 — the previous version was aspirational boilerplate for
# infrastructure this project never actually built: it built/pushed to
# Docker Hub, deployed to Kubernetes, and ran a "performance" job against
# `https://uraas.example.com` using tests/performance/locustfile.py — none
# of which exist. That last job alone failed on every single run (missing
# file, unreachable fake host), which is the real reason CI had been red on
# all 28 recorded runs regardless of whether the actual code was correct.
#
# The real deployment path is manual: scripts/push_to_hf.py to the Hugging
# Face Space, a deliberate, reviewed action — not something CI should
# auto-trigger on push. This workflow now only verifies what's true: lint,
# the test suite, and a non-blocking security scan.
name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Linting and Code Quality
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: Run Black
        run: black --check .

      - name: Run isort
        run: isort --check-only .

      - name: Run Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run MyPy
        run: mypy uraas --ignore-missing-imports

  # Unit Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Initialize Database
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        run: python scripts/init_db.py

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        run: |
          pytest tests/ --cov=uraas --cov-report=xml --cov-report=term

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          # Coverage upload is informational, not a correctness gate — a
          # Codecov outage shouldn't read as "the code is broken" when every
          # test above actually passed.
          fail_ci_if_error: false

  # Security Scan — informational only (continue-on-error on every step);
  # findings are worth reviewing but shouldn't block merges on their own.
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit Security Scan
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r uraas/ -f json -o bandit-report.json

      - name: Run Pip Audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --format json -o pip-audit-report.json

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
