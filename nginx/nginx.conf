# URAAS — Nginx Reverse Proxy Configuration
# Place SSL certificates in ./nginx/ssl/
#   cert: ./nginx/ssl/uraas.crt
#   key:  ./nginx/ssl/uraas.key
#
# For Let's Encrypt / Certbot:
#   certbot certonly --webroot -w /var/www/certbot -d repository.unilag.edu.ng
# Then update ssl_certificate paths below.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # ── Rate limiting — protect /login from brute-force ─────────────────────
    # Allow 10 login attempts per IP per minute (Flask-Limiter is a second layer).
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream uraas_app {
        server app:8080;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name repository.unilag.edu.ng;

        # Certbot ACME challenge (for Let's Encrypt renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name repository.unilag.edu.ng;

        # ── TLS certificates ─────────────────────────────────────────────────
        # Update these paths to your actual certificate files.
        ssl_certificate     /etc/nginx/ssl/uraas.crt;
        ssl_certificate_key /etc/nginx/ssl/uraas.key;

        # Modern TLS hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ── Security headers (supplement Flask's own headers) ─────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # Note: CSP is also set by Flask — nginx adds it only for non-proxied static files.

        # ── Rate limit login endpoint ─────────────────────────────────────────
        location = /login {
            limit_req zone=login_zone burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://uraas_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket support (Flask-SocketIO / crawler live feed) ───────────
        location /socket.io/ {
            proxy_pass http://uraas_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;   # Keep alive for long-running crawl streams
            proxy_send_timeout 86400;
        }

        # ── General proxy pass ───────────────────────────────────────────────
        location / {
            proxy_pass http://uraas_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;        # Required for SocketIO streaming
            proxy_read_timeout 120;
            proxy_send_timeout 120;
        }

        # ── Health check (internal use only) ─────────────────────────────────
        location = /health {
            proxy_pass http://uraas_app;
            access_log off;
        }
    }
}
