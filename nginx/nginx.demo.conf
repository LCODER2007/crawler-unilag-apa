# URAAS — Demo/VPS nginx config (HTTP-only, no domain required)
# Serves on port 80 by IP address; no SSL needed for the demo.
# Switch to nginx.conf (with SSL) once you have a domain + certificate.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

    upstream uraas_app {
        server app:8080;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;   # catch-all — works with bare IP

        # Rate limit login
        location = /login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://uraas_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (crawler live feed)
        location /socket.io/ {
            proxy_pass http://uraas_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location / {
            proxy_pass http://uraas_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 120;
        }

        location = /health {
            proxy_pass http://uraas_app;
            access_log off;
        }
    }
}
