<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — URAAS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version('css/style.css') }}">
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg, #0b1120); color: var(--text, #e2e8f0);
  }
  .login-card {
    width: 100%; max-width: 380px; padding: 2.25rem;
    background: var(--surface, #131c31); border: 1px solid var(--border, #1e293b);
    border-radius: 16px; box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .login-card h1 { font-size: 1.35rem; font-weight: 700; margin: 0 0 .25rem; }
  .login-card p.sub { font-size: .8rem; color: var(--text-muted, #94a3b8); margin: 0 0 1.5rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .04em; color: var(--text-muted, #94a3b8); margin-bottom: .4rem; }
  .field input {
    width: 100%; box-sizing: border-box; padding: .7rem .85rem;
    background: var(--bg, #0b1120); border: 1px solid var(--border, #1e293b);
    border-radius: 9px; color: var(--text, #e2e8f0); font-size: .9rem; outline: none;
  }
  .field input:focus { border-color: var(--accent, #38bdf8); }
  .btn-login {
    width: 100%; padding: .75rem; margin-top: .5rem; border: 0; border-radius: 9px;
    background: var(--accent, #38bdf8); color: #06121f; font-weight: 600;
    font-size: .9rem; cursor: pointer;
  }
  .btn-login:hover { filter: brightness(1.07); }
  .error {
    background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4);
    color: #fca5a5; font-size: .8rem; padding: .6rem .75rem; border-radius: 8px;
    margin-bottom: 1rem;
  }
  .brand { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent, #38bdf8); font-weight: 600; margin-bottom: .75rem; }
</style>
</head>
<body>
  <form class="login-card" method="POST" action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
    <div class="brand">URAAS</div>
    <h1>Sign in</h1>
    <p class="sub">African Research Intelligence Platform</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn-login" type="submit">Sign in</button>
  </form>
</body>
</html>
